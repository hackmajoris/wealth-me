name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install SQLCipher build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Frontend format check
        run: cd web && npm ci && npm run format:check

      # Also typechecks; output is embedded by pkg/web.
      - name: Build frontend
        run: make web-build

      - name: Build demo
        run: cd web && npm run build:demo

      - name: Go tests
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
